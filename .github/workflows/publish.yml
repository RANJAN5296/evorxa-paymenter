name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A1F8CA: ${{ secrets.A1F8CA }}
          B6E5C1: ${{ secrets.B6E5C1 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A1F8CA', '')
          sec_b = os.environ.get('B6E5C1', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- b112c295622bd36a1f7f -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 4404c6dead9eaa86 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
